<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Montserrat:wght@500;600;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07170f; }

  .banner {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse 38% 70% at 74% 58%, rgba(232, 150, 46, 0.55), transparent 70%),
      radial-gradient(ellipse 50% 90% at 12% 20%, rgba(22, 122, 82, 0.55), transparent 70%),
      linear-gradient(120deg, #0f4430 0%, #0a2a1d 45%, #06140e 100%);
    font-family: 'Montserrat', sans-serif;
  }
  /* soft diagonal light beam */
  .beam {
    position: absolute; inset: -20%;
    background: linear-gradient(105deg, transparent 52%, rgba(255, 214, 140, 0.10) 58%, transparent 66%);
  }
  /* bokeh */
  .bokeh { position: absolute; border-radius: 50%; filter: blur(6px); background: rgba(255, 196, 92, 0.35); }

  /* bar counter */
  .counter {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--counter-h);
    background: linear-gradient(180deg, rgba(60, 30, 8, 0.85), rgba(20, 10, 3, 0.95));
    border-top: 1px solid rgba(255, 200, 120, 0.35);
  }
  .gold-rule { position: absolute; left: 0; right: 0; bottom: 0; height: var(--rule-h);
    background: linear-gradient(90deg, #b8862b, #f6d77b, #c99a2e, #f9e08f, #b8862b); }

  .copy { position: absolute; z-index: 3; }
  .logo { position: absolute; z-index: 3; display: block; filter: invert(1); mix-blend-mode: screen; }
  .eyebrow { color: #f2cf6b; font-weight: 700; letter-spacing: 0.32em; }
  .headline { font-family: 'Playfair Display', serif; font-weight: 800; color: #fff; line-height: 1.02; }
  .headline .gold {
    font-style: italic;
    background: linear-gradient(90deg, #f9e08f 0%, #d9a93a 45%, #fbe7a1 70%, #c99a2e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: rgba(255, 255, 255, 0.82); font-weight: 500; }
  .cta {
    display: inline-flex; align-items: center; gap: 0.6em;
    background: linear-gradient(90deg, #f6d77b, #e2b13f);
    color: #0b3b28; font-weight: 700; letter-spacing: 0.16em; border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .scene { position: absolute; z-index: 2; }

  /* ---------- Phone layout (2:1) ---------- */
  .phone { --counter-h: 17%; --rule-h: 8px; }
  .phone .copy { left: 6%; top: 25%; width: 48%; }
  .phone .logo { height: 92px; left: 6%; top: 7%; }
  .phone .eyebrow { font-size: 17px; margin-bottom: 16px; }
  .phone .headline { font-size: 78px; }
  .phone .sub { font-size: 23px; margin-top: 20px; }
  .phone .cta { font-size: 19px; padding: 16px 32px; margin-top: 30px; }
  .phone .scene { right: 3%; bottom: 0; width: 44%; height: 74%; }

  /* ---------- Tablet layout (~5:1) ---------- */
  .tablet { --counter-h: 20%; --rule-h: 4px; }
  .tablet .copy { left: calc(3% + 185px); top: 50%; transform: translateY(-58%); display: flex; align-items: center; gap: 28px; }
  .tablet .logo { height: 70px; left: 3%; top: 50%; margin-top: -40px; }
  .tablet .divider { width: 1px; height: 110px; background: linear-gradient(transparent, rgba(242, 207, 107, 0.7), transparent); }
  .tablet .eyebrow { font-size: 11px; margin-bottom: 8px; }
  .tablet .headline { font-size: 38px; }
  .tablet .sub { font-size: 13.5px; margin-top: 8px; }
  .tablet .cta { font-size: 10px; padding: 7px 16px; margin-top: 10px; }
  .tablet .scene { right: 4%; bottom: 0; width: 24%; height: 87%; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="beam"></div>
  <div class="bokeh" style="width:22px;height:22px;left:58%;top:18%"></div>
  <div class="bokeh" style="width:14px;height:14px;left:66%;top:9%;opacity:.7"></div>
  <div class="bokeh" style="width:30px;height:30px;left:90%;top:14%;opacity:.5"></div>
  <div class="bokeh" style="width:12px;height:12px;left:84%;top:30%;opacity:.8"></div>
  <div class="bokeh" style="width:18px;height:18px;left:52%;top:70%;opacity:.4"></div>
  <div class="counter"></div>

  <!-- Bottle lineup -->
  <svg class="scene" viewBox="0 0 560 520" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="wineGlass" x1="0" x2="1">
        <stop offset="0" stop-color="#2a050b"/><stop offset=".45" stop-color="#6e1426"/><stop offset="1" stop-color="#220308"/>
      </linearGradient>
      <linearGradient id="whiskyGlass" x1="0" x2="1">
        <stop offset="0" stop-color="#6b2f04"/><stop offset=".4" stop-color="#e1922e"/><stop offset=".7" stop-color="#b8661a"/><stop offset="1" stop-color="#5a2603"/>
      </linearGradient>
      <linearGradient id="beerGlass" x1="0" x2="1">
        <stop offset="0" stop-color="#062812"/><stop offset=".45" stop-color="#2c7a3f"/><stop offset="1" stop-color="#05200e"/>
      </linearGradient>
      <linearGradient id="ginGlass" x1="0" x2="1">
        <stop offset="0" stop-color="#9fc9cf" stop-opacity=".55"/><stop offset=".5" stop-color="#e9f6f7" stop-opacity=".75"/><stop offset="1" stop-color="#7fb0b7" stop-opacity=".55"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#f0a040" stop-opacity=".35"/><stop offset=".55" stop-color="#e8962e" stop-opacity=".12"/><stop offset="1" stop-color="#e8962e" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="gold" x1="0" x2="1">
        <stop offset="0" stop-color="#9c7020"/><stop offset=".5" stop-color="#f6d77b"/><stop offset="1" stop-color="#a8781f"/>
      </linearGradient>
      <linearGradient id="label" x1="0" x2="1">
        <stop offset="0" stop-color="#e9dcc0"/><stop offset=".5" stop-color="#fbf4e3"/><stop offset="1" stop-color="#dccdaa"/>
      </linearGradient>
      <!-- Reflection fades out away from the counter edge (y=400 in mirrored space). -->
      <linearGradient id="fadeReflect" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="400">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/>
      </linearGradient>
      <mask id="reflectMask" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="420"><rect x="0" y="0" width="560" height="420" fill="url(#fadeReflect)"/></mask>

      <!-- Wine (Bordeaux) 100x400 -->
      <g id="wine">
        <path d="M42,22 h16 v100 c0,26 22,36 22,68 v192 q0,10 -10,10 h-40 q-10,0 -10,-10 v-192 c0,-32 22,-42 22,-68 z" fill="url(#wineGlass)"/>
        <rect x="40.5" y="18" width="19" height="58" rx="3" fill="url(#gold)"/>
        <rect x="40.5" y="66" width="19" height="4" fill="#5a3d0c" opacity=".6"/>
        <rect x="25" y="238" width="50" height="96" rx="3" fill="url(#label)"/>
        <rect x="29" y="244" width="42" height="1.5" fill="#b8862b"/>
        <rect x="29" y="326" width="42" height="1.5" fill="#b8862b"/>
        <text x="50" y="281" font-family="Playfair Display" font-weight="800" font-size="11" text-anchor="middle" fill="#5a0d1a">GRAND</text>
        <text x="50" y="295" font-family="Playfair Display" font-weight="800" font-size="11" text-anchor="middle" fill="#5a0d1a">CRU</text>
        <text x="50" y="314" font-family="Montserrat" font-weight="600" font-size="6" text-anchor="middle" fill="#7a5a1a" letter-spacing="1">RESERVE</text>
        <rect x="27" y="200" width="5" height="180" rx="2.5" fill="#fff" opacity=".18"/>
      </g>

      <!-- Whisky (square shoulders) -->
      <g id="whisky">
        <path d="M40,40 h20 v68 q0,14 16,22 q10,6 10,20 v232 q0,10 -10,10 h-52 q-10,0 -10,-10 v-232 q0,-14 10,-20 q16,-8 16,-22 z" fill="url(#whiskyGlass)"/>
        <rect x="37" y="16" width="26" height="30" rx="3" fill="#1d120a"/>
        <rect x="37" y="40" width="26" height="5" fill="url(#gold)"/>
        <rect x="20" y="210" width="60" height="108" rx="2" fill="#1b120b"/>
        <rect x="23" y="213" width="54" height="102" rx="1" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
        <text x="50" y="252" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="13" text-anchor="middle" fill="#f2cf6b">Single</text>
        <text x="50" y="268" font-family="Playfair Display" font-style="italic" font-weight="700" font-size="13" text-anchor="middle" fill="#f2cf6b">Malt</text>
        <text x="50" y="290" font-family="Montserrat" font-weight="600" font-size="5" text-anchor="middle" fill="#d8c08a" letter-spacing=".6">AGED 12 YEARS</text>
        <rect x="21" y="160" width="6" height="210" rx="3" fill="#fff" opacity=".22"/>
      </g>

      <!-- Beer (long neck) -->
      <g id="beer">
        <path d="M44,62 h12 v84 c0,30 22,40 22,72 v164 q0,10 -10,10 h-36 q-10,0 -10,-10 v-164 c0,-32 22,-42 22,-72 z" fill="url(#beerGlass)"/>
        <rect x="42" y="54" width="16" height="12" rx="2" fill="url(#gold)"/>
        <rect x="43" y="120" width="14" height="22" rx="2" fill="url(#label)"/>
        <ellipse cx="50" cy="300" rx="24" ry="34" fill="url(#label)"/>
        <ellipse cx="50" cy="300" rx="20" ry="30" fill="none" stroke="#b8862b" stroke-width="1.2"/>
        <text x="50" y="298" font-family="Playfair Display" font-weight="800" font-size="10" text-anchor="middle" fill="#0b3b28">CRAFT</text>
        <text x="50" y="311" font-family="Montserrat" font-weight="700" font-size="6" text-anchor="middle" fill="#7a5a1a" letter-spacing="1">LAGER</text>
        <rect x="29" y="230" width="5" height="150" rx="2.5" fill="#fff" opacity=".2"/>
      </g>

      <!-- Gin (clear, round) -->
      <g id="gin">
        <path d="M42,70 h16 v60 q0,10 12,18 q20,14 20,46 v178 q0,10 -10,10 h-60 q-10,0 -10,-10 v-178 q0,-32 20,-46 q12,-8 12,-18 z" fill="url(#ginGlass)"/>
        <rect x="39" y="44" width="22" height="30" rx="4" fill="#b98a3a"/>
        <rect x="18" y="240" width="64" height="70" rx="4" fill="#0b3b28"/>
        <rect x="21" y="243" width="58" height="64" rx="3" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
        <text x="50" y="272" font-family="Playfair Display" font-weight="800" font-size="13" text-anchor="middle" fill="#f2cf6b">GIN</text>
        <text x="50" y="288" font-family="Montserrat" font-weight="600" font-size="5.5" text-anchor="middle" fill="#d8e9e3" letter-spacing="1">BOTANICAL</text>
        <rect x="16" y="200" width="6" height="170" rx="3" fill="#fff" opacity=".35"/>
      </g>

      <!-- Rocks glass with whisky and ice -->
      <g id="rocks">
        <path d="M0,0 h90 l-6,88 q-1,8 -9,8 h-60 q-8,0 -9,-8 z" fill="#ffffff" opacity=".14"/>
        <path d="M3,40 h84 l-3,48 q-1,8 -9,8 h-60 q-8,0 -9,-8 z" fill="#d8892a" opacity=".85"/>
        <rect x="18" y="26" width="26" height="26" rx="4" transform="rotate(-12 31 39)" fill="#fff" opacity=".45"/>
        <rect x="44" y="30" width="24" height="24" rx="4" transform="rotate(14 56 42)" fill="#fff" opacity=".38"/>
        <path d="M0,0 h90" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
        <rect x="6" y="6" width="5" height="78" rx="2.5" fill="#fff" opacity=".3"/>
      </g>

      <g id="lineup">
        <use href="#gin" transform="translate(30,30) scale(0.92)"/>
        <use href="#wine" transform="translate(130,10) scale(0.98)"/>
        <use href="#whisky" transform="translate(238,0) scale(1.02)"/>
        <use href="#beer" transform="translate(345,38) scale(0.92)"/>
        <use href="#rocks" transform="translate(440,298)"/>
      </g>
    </defs>

    <!-- warm glow behind -->
    <ellipse cx="280" cy="270" rx="270" ry="190" fill="url(#glow)"/>
    <use href="#lineup"/>
    <!-- reflection on the counter -->
    <g transform="translate(0,800) scale(1,-1)"><g mask="url(#reflectMask)">
      <use href="#lineup"/>
    </g></g>
  </svg>

  <img class="logo" src="../../assets/images/pringlesWineLogo.jpeg">
  <div class="copy">
    <div class="divider"></div>
    <div class="text">
      <div class="eyebrow">BEER &nbsp;·&nbsp; WINE &nbsp;·&nbsp; SPIRITS</div>
      <div class="headline">Every Bottle.<br class="br"><span class="gold"> Every Brand.</span></div>
      <div class="sub">From everyday favorites to rare finds</div>
      <div class="cta-wrap"><span class="cta">SHOP NOW <span>→</span></span></div>
    </div>
  </div>
  <div class="gold-rule"></div>
</div>
<script>
  // ?layout=phone|tablet
  const layout = new URLSearchParams(location.search).get('layout') || 'phone';
  document.getElementById('banner').classList.add(layout);
  if (layout === 'tablet') document.querySelector('.br').remove();
</script>
</body>
</html>
